<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="dayGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" /> <!-- blue-600 -->
      <stop offset="100%" stop-color="#4f46e5" /> <!-- indigo-600 -->
    </linearGradient>
  </defs>
  <!-- Shop -->
  <text x="0" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="80" fill="#0f172a" letter-spacing="-0.02em">
    Shop
  </text>
  <!-- Day™ -->
  <text x="200" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="80" fill="url(#dayGradient)" letter-spacing="-0.02em">
    Day
    <tspan font-size="30" dy="-40" fill="url(#dayGradient)">™</tspan>
  </text>
</svg>
