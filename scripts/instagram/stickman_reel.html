<!doctype html>
<meta charset="utf-8">
<title>stickman reel</title>
<style>
  html, body { margin: 0; background: #06070a; overflow: hidden; }
  canvas { display: block; }
</style>
<canvas id="c"></canvas>
<script>
/*
 * The comic carousel, staged as stick figures. No voice, no music.
 *
 * WHY FIGURES INSTEAD OF TYPE. The text reel has no motion a viewer can track,
 * so it fakes some with a 3.5% drift. A figure that turns, counts or slumps
 * gives the eye something real, and bodies hold attention that words do not.
 * It also works MUTED, which is how most of this is watched — a format that
 * needs no sound is not a compromise here, it is the point.
 *
 * CANVAS, NOT SVG. Every figure is generated from joint angles rather than
 * drawn, so there is no path data to hand-author and a new pose is six numbers.
 *
 * EVERYTHING IS A PURE FUNCTION OF t. The renderer screenshots frames as fast
 * as it can rather than in real time, so anything driven by a clock or a
 * requestAnimationFrame would render as a stutter or not at all.
 */

const q = new URLSearchParams(location.search);
const W = +(q.get("w") || 1080), H = +(q.get("h") || 1920);
const DECK = JSON.parse(q.get("deck") || "[]");
/* A film is a shot list with no words. Present means render the film path. */
const FILM = JSON.parse(q.get("film") || "null");
const CHIP = q.get("chip") || "Shop Talk";
const TOTAL = DECK.reduce((a, c) => a + c.secs, 0);

const cv = document.getElementById("c");
cv.width = W; cv.height = H;
const g = cv.getContext("2d");

const INK = "#f1f5f9", DIM = "#94a3b8", AMBER = "#ffd166", GROUND = "#06070a", PURPLE = "#a855f7";
const U = Math.min(W, H);

/* ---------- small maths ---------- */
const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

/* ---------- the rig ----------
 * A figure is a hip point, a scale, and eight joint angles. Angles are radians
 * from straight DOWN, clockwise positive, so 0 is a limb hanging and Math.PI is
 * a limb pointing straight up. Keeping one convention for every joint is what
 * makes a pose readable as six numbers instead of a diagram.
 */
function seg(x, y, ang, len) {
  return [x + Math.sin(ang) * len, y + Math.cos(ang) * len];
}

const POSES = {
  stand:  { torso: 0.00, head: 0.00, aL: [0.22, 0.12], aR: [-0.22, -0.12], lL: [0.10, 0.02], lR: [-0.10, -0.02] },
  count:  { torso: -0.08, head: -0.18, aL: [2.35, 0.55], aR: [-0.20, -0.10], lL: [0.10, 0.02], lR: [-0.12, -0.02] },
  cut:    { torso: -0.06, head: -0.10, aL: [2.55, 1.05], aR: [2.10, 0.85], lL: [0.12, 0.02], lR: [-0.14, -0.02] },
  slump:  { torso: 0.30, head: 0.34, aL: [0.05, 0.30], aR: [-0.05, -0.30], lL: [0.06, 0.02], lR: [-0.06, -0.02] },
  sit:    { torso: 0.05, head: 0.02, aL: [0.55, 0.30], aR: [-0.55, -0.30], lL: [1.45, 0.05], lR: [-1.45, -0.05] },
  wait:   { torso: 0.10, head: 0.14, aL: [0.30, 0.55], aR: [-0.30, -0.55], lL: [1.40, 0.10], lR: [-1.40, -0.10] },
  // Added for the films. `glance` looks at the floor, `hold` is frozen with the
  // arms dropped, `raise` lifts the left hand so a prop can be hung off it.
  glance: { torso: 0.12, head: 0.55, aL: [0.15, 0.25], aR: [-0.15, -0.25], lL: [0.10, 0.02], lR: [-0.10, -0.02] },
  hold:   { torso: 0.02, head: 0.06, aL: [0.08, 0.05], aR: [-0.08, -0.05], lL: [0.08, 0.02], lR: [-0.08, -0.02] },
  raise:  { torso: -0.04, head: -0.06, aL: [2.45, 0.60], aR: [-0.18, -0.10], lL: [0.10, 0.02], lR: [-0.12, -0.02] },
};

/* ---------- expressions ----------
 * FOUR NUMBERS, the same way a pose is six. Eye openness, brow angle, mouth
 * curve, mouth opening — and nothing else. The temptation is a face rig with
 * pupils that track and cheeks that lift, and the reason to refuse it is the
 * same reason the pose vocabulary is small: every extra number is another thing
 * to author per card and another thing to look wrong at 200 pixels.
 *
 * WHY FACES AT ALL, when the format shipped without them. The horror format
 * this is being extended for runs entirely on expression — dread, then relief,
 * then the real thing. A faceless figure can carry a slump; it cannot carry a
 * man realising what he has done. Nothing existing changes: a figure drawn
 * without an `expr` is drawn exactly as before.
 */
const EXPR = {
  calm:   { eye: 0.55, brow:  0.00, curve:  0.00, open: 0.00 },
  shut:   { eye: 0.00, brow:  0.05, curve:  0.10, open: 0.00 },
  alert:  { eye: 1.00, brow:  0.20, curve: -0.10, open: 0.15 },
  panic:  { eye: 1.00, brow:  0.55, curve: -0.70, open: 0.80 },
  relief: { eye: 0.30, brow:  0.06, curve:  0.65, open: 0.05 },
  horror: { eye: 1.00, brow:  0.75, curve: -0.85, open: 1.00 },
};

function blendExpr(a, b, t) {
  const o = {};
  for (const k of ["eye", "brow", "curve", "open"]) o[k] = lerp(a[k], b[k], t);
  return o;
}

/**
 * Draw a face inside the head circle.
 *
 * THE FACE ROTATES WITH THE HEAD. The head is placed along torso+head, so a
 * slumped figure's skull leans — and a face drawn in screen space slides off
 * the side of it. Canvas rotates clockwise for a positive angle while this rig
 * measures clockwise from straight down, so the rotation applied is the
 * NEGATIVE of the head angle. Getting that sign wrong tilts the face the wrong
 * way, which reads as a drawing mistake rather than a maths one.
 */
function drawFace(hx, hy, hr, headAngle, e) {
  g.save();
  g.translate(hx, hy);
  g.rotate(-headAngle);

  const ex = 0.40 * hr;          // eye offset from centre
  const ey = -0.12 * hr;
  const w  = 0.19 * hr;          // eye half-width
  const h  = Math.max(0.02, e.eye) * 0.19 * hr;

  g.lineCap = "round";
  g.lineJoin = "round";

  for (const side of [-1, 1]) {
    // eye — an ellipse that collapses to a line as openness goes to zero
    g.beginPath();
    g.ellipse(side * ex, ey, w, h, 0, 0, Math.PI * 2);
    g.stroke();
    if (e.eye > 0.15) {
      g.beginPath();
      g.arc(side * ex, ey, Math.min(w, h) * 0.55, 0, Math.PI * 2);
      g.fillStyle = g.strokeStyle;
      g.fill();
    }
    /*
     * Brow. POSITIVE `brow` RAISES THE INNER ENDS — the fear shape. Lowering
     * the inner ends instead is the anger shape, and the two are a sign flip
     * apart: the first pass had it backwards and panic, alert and horror all
     * read as a man who was annoyed rather than frightened. Negative values
     * still give the angry brow, which is why the number is signed instead of
     * a separate expression field.
     */
    const by = ey - h - 0.22 * hr - Math.abs(e.brow) * 0.10 * hr;
    g.beginPath();
    g.moveTo(side * (ex - w), by - e.brow * 0.10 * hr);   // inner end
    g.lineTo(side * (ex + w), by + e.brow * 0.04 * hr);   // outer end
    g.stroke();
  }

  /*
   * Mouth. A closed mouth is one curve; an open one is a filled shape, because
   * an outline alone at this size reads as a smudge rather than a shout.
   */
  const my = 0.44 * hr;
  const mw = 0.34 * hr;
  if (e.open > 0.08) {
    const mh = e.open * 0.34 * hr;
    g.beginPath();
    g.ellipse(0, my + mh * 0.2, mw * 0.8, mh, 0, 0, Math.PI * 2);
    g.fillStyle = g.strokeStyle;
    g.fill();
  } else {
    g.beginPath();
    g.moveTo(-mw, my);
    g.quadraticCurveTo(0, my + e.curve * 0.30 * hr, mw, my);
    g.stroke();
  }
  g.restore();
}

function blendPose(a, b, t) {
  const o = {};
  for (const k of ["torso", "head"]) o[k] = lerp(a[k], b[k], t);
  for (const k of ["aL", "aR", "lL", "lR"]) o[k] = [lerp(a[k][0], b[k][0], t), lerp(a[k][1], b[k][1], t)];
  return o;
}

/**
 * Draw one figure.
 *
 * `breath` is a tiny continuous bob applied to the torso length. It exists
 * because a figure holding a pose perfectly still for four seconds reads as a
 * frozen frame, and a frozen frame in a video feed reads as nothing happening.
 */
function figure(x, groundY, s, pose, breath, opts = {}) {
  // A seated figure's hip belongs at seat height, not a leg-length above the
  // floor — otherwise it stands behind the chair with its legs stuck out.
  if (opts.seatedAt !== undefined) groundY = opts.seatedAt + 0.92 * s;
  const LEG = 0.92 * s, TORSO = (0.72 + breath * 0.012) * s, ARM = 0.40 * s, FORE = 0.36 * s;
  const SHIN = LEG * 0.5, THIGH = LEG * 0.5;
  const hipY = groundY - LEG;
  const [nx, ny] = seg(x, hipY, pose.torso + Math.PI, TORSO);

  g.strokeStyle = opts.color || INK;
  g.lineWidth = (opts.weight || 0.030) * s * INK_SCALE;
  g.lineCap = "round";
  g.lineJoin = "round";

  const bone = (x1, y1, ang, len) => {
    const [x2, y2] = seg(x1, y1, ang, len);
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
    return [x2, y2];
  };

  // legs from the hip, arms from the neck
  let [kx, ky] = bone(x, hipY, pose.lL[0], THIGH); bone(kx, ky, pose.lL[0] + pose.lL[1], SHIN);
  [kx, ky] = bone(x, hipY, pose.lR[0], THIGH);     bone(kx, ky, pose.lR[0] + pose.lR[1], SHIN);
  g.beginPath(); g.moveTo(x, hipY); g.lineTo(nx, ny); g.stroke();
  /*
   * Arms hang from SHOULDERS, a little below and either side of the neck — not
   * from the neck point itself. Hung from the neck, a raised arm passes
   * straight through the head, which is the first thing anyone notices and
   * reads as broken rather than stylised.
   */
  const sh = 0.10 * s;
  const shy = ny + 0.06 * s;
  let [ex, ey] = bone(nx - sh, shy, pose.aL[0], ARM); const handL = bone(ex, ey, pose.aL[0] + pose.aL[1], FORE);
  [ex, ey] = bone(nx + sh, shy, pose.aR[0], ARM);     bone(ex, ey, pose.aR[0] + pose.aR[1], FORE);

  // head
  const hr = 0.20 * s;
  const [hx, hy] = seg(nx, ny, pose.torso + pose.head + Math.PI, hr * 1.25);
  g.beginPath(); g.arc(hx, hy, hr, 0, Math.PI * 2); g.stroke();
  // Faceless unless asked: every story staged before this one renders unchanged.
  if (opts.expr) drawFace(hx, hy, hr, pose.torso + pose.head, opts.expr);

  return { neck: [nx, ny], head: [hx, hy - hr], hand: handL };
}

/* ---------- the camera ----------
 * A camera is three numbers: the world point held at frame centre, and a zoom.
 *
 * WHY A CAMERA AT ALL. Every shot so far is the same wide two-shot, because
 * that is all the format needed — a figure, a bench, a bubble. A macro push
 * onto a clipper guard is a different kind of shot, and faking it by drawing
 * the prop enormous means the set behind it stays wide and the scale lies.
 * Moving the camera keeps one world and lets the frame choose what to look at.
 *
 * IT WRAPS THE SET AND THE FIGURES ONLY. Speech bubbles, captions and the
 * wordmark are surface, not scene: pushing in on the shop must not push in on
 * the branding, and a bubble that scales with a zoom stops being readable,
 * which is the one thing it exists to be.
 */
const CAM_WIDE = { x: null, y: null, zoom: 1 };   // null = frame centre, i.e. no move

/*
 * INK IS THE RECIPROCAL OF THE ZOOM, and every stroke width is multiplied by
 * it. canvas scale() scales strokes too, so a 5.5x macro push rendered the
 * linework five and a half times heavier and the figure turned to sludge —
 * correct as magnification, wrong as drawing. Hand-drawn animation holds its
 * line weight through a push; the pen does not get fatter because the camera
 * moved. Dividing here keeps one number in one place instead of a correction
 * scattered through every draw call.
 */
let INK_SCALE = 1;

function applyCamera(cam) {
  INK_SCALE = 1;
  if (!cam || (cam.zoom === 1 && cam.x == null)) return;
  const cx = cam.x == null ? W / 2 : cam.x;
  const cy = cam.y == null ? H / 2 : cam.y;
  g.translate(W / 2, H / 2);
  g.scale(cam.zoom, cam.zoom);
  g.translate(-cx, -cy);
  INK_SCALE = 1 / cam.zoom;
}

function blendCamera(a, b, t) {
  const ax = a.x == null ? W / 2 : a.x, ay = a.y == null ? H / 2 : a.y;
  const bx = b.x == null ? W / 2 : b.x, by = b.y == null ? H / 2 : b.y;
  /*
   * Zoom interpolates GEOMETRICALLY. A linear ramp from 1x to 6x spends most of
   * its time already close, so a push reads as a lurch then a crawl; the eye
   * reads equal ratios as equal steps, not equal differences.
   */
  return { x: lerp(ax, bx, t), y: lerp(ay, by, t), zoom: a.zoom * Math.pow(b.zoom / a.zoom, t) };
}

/* ---------- props ----------
 * Drawn from a local origin at the working end and rotated into place, so a
 * prop in a hand and the same prop falling to the floor are one function with
 * a different angle rather than two drawings that can drift apart.
 */

/** Hair clippers. `guard` may be true, false, or a number of units of slip. */
function clippers(x, y, s, ang, opts = {}) {
  const guard = opts.guard === undefined ? true : opts.guard;
  g.save();
  g.translate(x, y);
  g.rotate(ang);
  g.lineWidth = Math.max(1.5, 0.055 * s) * INK_SCALE;
  g.lineCap = "round";
  g.lineJoin = "round";

  // body — a plain rounded block; detail here reads as noise at reel size
  g.beginPath();
  if (g.roundRect) g.roundRect(-0.30 * s, 0, 0.60 * s, 1.00 * s, 0.16 * s);
  else g.rect(-0.30 * s, 0, 0.60 * s, 1.00 * s);
  g.stroke();

  // blade deck at the working end
  g.beginPath();
  g.moveTo(-0.30 * s, 0);
  g.lineTo(-0.38 * s, -0.16 * s);
  g.lineTo(0.38 * s, -0.16 * s);
  g.lineTo(0.30 * s, 0);
  g.stroke();

  if (guard !== false) {
    /*
     * THE GUARD IS DRAWN AS ITS OWN THING, offset by `slip`. That is the whole
     * reason this prop exists: the shot needs it seated, then hanging, then
     * gone, and a guard baked into the clipper outline can only ever be seated.
     */
    const slip = typeof guard === "number" ? guard : 0;
    guardComb(0, -0.16 * s - slip * 0.5 * s, s, slip * 0.5, { local: true });
  }
  g.restore();
}

/** The comb attachment. Drawn alone when it has come off and is falling. */
function guardComb(x, y, s, ang, opts = {}) {
  if (!opts.local) { g.save(); g.translate(x, y); g.rotate(ang); }
  else { g.save(); g.translate(x, y); g.rotate(ang); }
  g.lineWidth = Math.max(1.5, 0.050 * s) * INK_SCALE;
  g.lineCap = "round";
  g.lineJoin = "round";
  const halfW = 0.40 * s, depth = 0.20 * s;
  g.beginPath();
  g.moveTo(-halfW, 0); g.lineTo(-halfW, -depth); g.lineTo(halfW, -depth); g.lineTo(halfW, 0);
  g.stroke();
  const teeth = 7;
  for (let i = 0; i <= teeth; i++) {
    const tx = -halfW + (2 * halfW * i) / teeth;
    g.beginPath(); g.moveTo(tx, -depth); g.lineTo(tx, -depth - 0.22 * s); g.stroke();
  }
  g.restore();
}

/** Hand mirror. `reflect` draws inside the glass, in mirror-local coordinates. */
function handMirror(x, y, s, ang, opts = {}) {
  g.save();
  g.translate(x, y);
  g.rotate(ang);
  g.lineWidth = Math.max(1.5, 0.045 * s) * INK_SCALE;
  g.lineCap = "round";
  const rx = 0.52 * s, ry = 0.68 * s;
  g.beginPath(); g.ellipse(0, -ry, rx, ry, 0, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 0.62 * s); g.stroke();
  if (opts.reflect) {
    /*
     * Clipped to the glass, and the caller is handed the INNER radii — not the
     * rim's. Passing the outer size let a reflected face fill the oval edge to
     * edge, and the whole thing read as a face on a stick rather than a face in
     * a mirror. A mirror is only legible when you can see glass around what is
     * in it.
     */
    g.save();
    g.beginPath(); g.ellipse(0, -ry, rx * 0.88, ry * 0.88, 0, 0, Math.PI * 2); g.clip();
    opts.reflect(rx * 0.60, ry * 0.60);
    g.restore();
  }
  g.restore();
}

/* ---------- the set ---------- */
function drawSet(beat, benchCount, tIn) {
  const floorY = H * 0.78;
  // floor
  g.strokeStyle = "#1e2430"; g.lineWidth = U * 0.006;
  g.beginPath(); g.moveTo(W * 0.04, floorY); g.lineTo(W * 0.96, floorY); g.stroke();

  // mirror on the wall
  g.strokeStyle = "#1a2130"; g.lineWidth = U * 0.005;
  g.strokeRect(W * 0.10, H * 0.44, W * 0.26, H * 0.16);

  // the chair
  const chairX = W * 0.30;
  g.strokeStyle = "#2a3342"; g.lineWidth = U * 0.010;
  g.beginPath();
  g.moveTo(chairX - U * 0.09, floorY);
  g.lineTo(chairX - U * 0.09, floorY - U * 0.16);
  g.lineTo(chairX + U * 0.07, floorY - U * 0.16);
  g.stroke();
  g.beginPath(); g.moveTo(chairX, floorY - U * 0.16); g.lineTo(chairX, floorY); g.stroke();

  // the bench, and whoever is on it
  if (benchCount > 0) {
    const bx = W * 0.60, by = floorY;
    g.strokeStyle = "#2a3342"; g.lineWidth = U * 0.010;
    g.beginPath(); g.moveTo(bx - U * 0.05, by - U * 0.10); g.lineTo(W * 0.95, by - U * 0.10); g.stroke();
    for (let i = 0; i < Math.min(benchCount, 6); i++) {
      const fx = bx + i * U * 0.075;
      if (fx > W * 0.95) break;
      // Each waiter breathes on its own phase so the row is not a chorus line.
      const b = Math.sin(tIn * 2.4 + i * 1.7);
      figure(fx, by, U * 0.135, POSES.wait, b, { color: "#5c6a7d", weight: 0.026, seatedAt: by - U * 0.10 });
    }
  }
  return { floorY, chairX };
}

function phone(x, y, s, buzz) {
  const shake = Math.sin(buzz * 34) * s * 0.05 * (buzz > 0 ? 1 : 0);
  g.save(); g.translate(x + shake, y);
  g.strokeStyle = AMBER; g.lineWidth = s * 0.10; g.lineJoin = "round";
  g.beginPath(); g.roundRect(-s * 0.28, -s * 0.5, s * 0.56, s, s * 0.12); g.stroke();
  g.globalAlpha = 0.30 + 0.30 * Math.abs(Math.sin(buzz * 20));
  g.beginPath(); g.arc(0, 0, s * 0.95, 0, Math.PI * 2); g.stroke();
  g.restore(); g.globalAlpha = 1;
}

/* ---------- text ---------- */
function wrap(text, maxW, font) {
  g.font = font;
  const words = text.split(/\s+/);
  const lines = []; let line = "";
  for (const w of words) {
    const probe = line ? line + " " + w : w;
    if (g.measureText(probe).width > maxW && line) { lines.push(line); line = w; }
    else line = probe;
  }
  if (line) lines.push(line);
  return lines;
}

/**
 * A speech bubble with a tail pointing at whoever said it.
 *
 * The tail is the whole reason to draw a bubble rather than caption the line:
 * with four figures on screen, a caption says something was said and a tail
 * says who said it, and the joke usually depends on which.
 */
function bubble(text, anchor, reveal) {
  const font = `700 ${U * 0.052}px "Helvetica Neue", Inter, system-ui, sans-serif`;
  const maxW = W * 0.72;
  const lines = wrap(text, maxW, font);
  const lh = U * 0.066;
  const padX = U * 0.045, padY = U * 0.040;
  let bw = 0;
  for (const l of lines) bw = Math.max(bw, g.measureText(l).width);
  bw += padX * 2;
  const bh = lines.length * lh + padY * 2 - (lh - U * 0.052);

  let bx = Math.min(Math.max(anchor[0] - bw / 2, W * 0.05), W * 0.95 - bw);
  const by = anchor[1] - bh - U * 0.10;

  const k = easeOut(clamp01(reveal));
  g.save();
  g.translate(bx + bw / 2, by + bh);
  g.scale(0.86 + 0.14 * k, 0.86 + 0.14 * k);
  g.globalAlpha = k;
  g.translate(-(bx + bw / 2), -(by + bh));

  g.fillStyle = "#f8fafc";
  g.beginPath(); g.roundRect(bx, by, bw, bh, U * 0.030); g.fill();
  // tail
  g.beginPath();
  g.moveTo(anchor[0] - U * 0.022, by + bh - 1);
  g.lineTo(anchor[0], anchor[1] - U * 0.045);
  g.lineTo(anchor[0] + U * 0.026, by + bh - 1);
  g.closePath(); g.fill();

  g.fillStyle = "#0b0f14"; g.font = font; g.textBaseline = "top";
  lines.forEach((l, i) => g.fillText(l, bx + padX, by + padY + i * lh));
  g.restore(); g.globalAlpha = 1;
}

function narration(lines, reveal, big) {
  /*
   * Narration SHRINKS when a card is wordy rather than growing downward into
   * the scene. The copy was written for carousel cards, which have a whole
   * frame each; the same lines over an animated set have maybe a third of one.
   * Overflowing looked like a layout bug and hid the figures.
   */
  const words = lines.join(" ").split(/\s+/).length;
  const squeeze = words > 22 ? 0.76 : words > 14 ? 0.87 : 1;
  const size = (big ? U * 0.108 : U * 0.058) * (big ? 1 : squeeze);
  const font = `${big ? 900 : 700} ${size}px "Helvetica Neue", Inter, system-ui, sans-serif`;
  const lh = size * (big ? 1.04 : 1.26);
  const all = [];
  for (const raw of lines) for (const l of wrap(big ? raw.toUpperCase() : raw, W * 0.84, font)) all.push(l);
  // Clear of the chip, which sits at U*0.196 and is roughly U*0.064 tall.
  const startY = big ? H * 0.40 - (all.length * lh) / 2 : U * 0.300;
  g.font = font; g.textBaseline = "top"; g.fillStyle = big ? "#f8fafc" : "#e2e8f0";
  all.forEach((l, i) => {
    const k = easeOut(clamp01((reveal - i * 0.10) / 0.18));
    g.save(); g.globalAlpha = k;
    g.fillText(l, W * 0.08, startY + i * lh + (1 - k) * U * 0.030);
    g.restore();
  });
  g.globalAlpha = 1;
}

function furniture() {
  // The same dashed rules and wordmark as every other surface, kept clear of
  // Instagram's caption and action-rail overlays.
  const pad = W * 0.08;
  const dash = () => { g.setLineDash([U * 0.030, U * 0.030]); g.strokeStyle = PURPLE; g.globalAlpha = 0.55; g.lineWidth = U * 0.006; };
  dash(); g.beginPath(); g.moveTo(pad, U * 0.150); g.lineTo(W - pad, U * 0.150); g.stroke();
  g.beginPath(); g.moveTo(pad, H - U * 0.296); g.lineTo(W - pad, H - U * 0.296); g.stroke();
  g.setLineDash([]); g.globalAlpha = 1;

  g.font = `900 ${U * 0.030}px "Helvetica Neue", Inter, system-ui, sans-serif`;
  g.textBaseline = "middle";
  const cy = U * 0.196 + U * 0.022;
  g.strokeStyle = "#6b5a1f"; g.lineWidth = U * 0.0035;
  const label = CHIP.toUpperCase();
  const tw = g.measureText(label).width;
  g.beginPath(); g.roundRect(pad, cy - U * 0.032, tw + U * 0.064, U * 0.064, 999); g.stroke();
  g.fillStyle = AMBER; g.fillText(label, pad + U * 0.032, cy);

  g.fillStyle = DIM;
  g.fillText("SHEARQUERY.COM", pad + U * 0.055, H - U * 0.231);
  g.strokeStyle = AMBER; g.lineWidth = U * 0.007; g.lineCap = "round";
  const mx = pad + U * 0.020, my = H - U * 0.231, r = U * 0.017;
  g.beginPath(); g.moveTo(mx - r, my - r); g.lineTo(mx + r, my + r);
  g.moveTo(mx + r, my - r); g.lineTo(mx - r, my + r); g.stroke();
}

/* ---------- the film ----------
 * A silent shot list. No cards, no bubbles, no narration, and no wordmark —
 * the format's whole claim is that it needs none of them, and a logo in the
 * corner of an 11-second horror beat is the one thing that would break it.
 */
const FILM_TOTAL = FILM ? FILM.shots.reduce((a, s) => a + s.secs, 0) : 0;

function drawFilm(now) {
  let acc = 0, shot = FILM.shots[0], local = 0;
  for (const s of FILM.shots) {
    if (now < acc + s.secs) { shot = s; local = now - acc; break; }
    acc += s.secs;
    shot = s; local = s.secs;
  }
  const p = clamp01(local / shot.secs);

  g.fillStyle = GROUND; g.fillRect(0, 0, W, H);

  /*
   * Camera moves EASE. A linear push starts and stops abruptly, which reads as
   * a cut on a moving frame; easeInOut gives it the weight of a hand.
   */
  const camA = { x: shot.cam.x * W, y: shot.cam.y * H, zoom: shot.cam.zoom };
  const camB = shot.camTo
    ? { x: shot.camTo.x * W, y: shot.camTo.y * H, zoom: shot.camTo.zoom }
    : camA;
  const cam = blendCamera(camA, camB, easeInOut(p));

  g.save();
  applyCamera(cam);

  const set = drawSet("idle", 0, now);
  const S = U * 0.165;

  if (shot.client) {
    const c = figure(set.chairX - U * 0.005, set.floorY, S, POSES.sit, Math.sin(now * 1.7), {
      color: "#5c6a7d", weight: 0.026, seatedAt: set.floorY - U * 0.155,
      expr: EXPR[shot.client.expr],
    });
    if (shot.mirror) {
      /*
       * The mirror is held between the barber and the client's face, not in the
       * barber's hand — the shot is the REFLECTION, and a mirror hung off a
       * raised arm points wherever the arm happens to be.
       */
      const mx = c.head[0] + U * 0.115, my = c.head[1] + U * 0.055;
      handMirror(mx, my, U * 0.085, 0.10, {
        reflect: (rx, ry) => {
          const hy = -ry * 1.6;
          g.beginPath(); g.arc(0, hy, ry * 0.95, 0, Math.PI * 2); g.stroke();
          drawFace(0, hy, ry * 0.95, 0, EXPR[shot.mirror]);
        },
      });
    }
  }

  const barberX = W * 0.20;
  const b = figure(barberX, set.floorY, S, POSES[shot.barber.pose] || POSES.stand,
    Math.sin(now * 2.1), { expr: EXPR[shot.barber.expr] });

  // Clippers live in the working hand, so they follow the pose for free.
  if (shot.guard !== false || !shot.fallen || true) {
    const grip = b.hand || b.head;
    clippers(grip[0], grip[1], U * 0.038, 0.30, { guard: shot.guard });
  }

  if (shot.fallen) {
    // On the floor by the chair, where it fell. Fixed spot: a guard that moves
    // between shots reads as a second guard.
    guardComb(set.chairX - U * 0.10, set.floorY - U * 0.004, U * 0.034, 1.15);
  }

  g.restore();
}

/* ---------- the frame ---------- */
window.__setT = (t) => {
  if (FILM) return drawFilm(t * FILM_TOTAL);
  const now = t * TOTAL;
  let acc = 0, idx = 0, local = 0;
  for (let i = 0; i < DECK.length; i++) {
    if (now < acc + DECK[i].secs || i === DECK.length - 1) { idx = i; local = now - acc; break; }
    acc += DECK[i].secs;
  }
  const card = DECK[idx];
  const p = clamp01(local / card.secs);
  const prev = DECK[Math.max(0, idx - 1)];

  g.fillStyle = GROUND; g.fillRect(0, 0, W, H);

  if (card.beat === "reveal") {
    narration(card.lines, p / 0.5, true);
    if (card.ask) {
      g.fillStyle = AMBER;
      g.beginPath(); g.arc(W * 0.08 + U * 0.043, H * 0.40 - U * 0.150, U * 0.043, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#06070a"; g.font = `900 ${U * 0.050}px "Helvetica Neue", sans-serif`;
      g.textBaseline = "middle"; g.textAlign = "center";
      g.fillText("?", W * 0.08 + U * 0.043, H * 0.40 - U * 0.150);
      g.textAlign = "left";
    }
    furniture();
    return;
  }

  // Poses cross-fade over the first third of a card, so a change of beat reads
  // as a movement rather than as a jump cut on the body.
  const poseFor = (b) => (b === "counting" ? POSES.count : b === "cutting" ? POSES.cut : b === "slump" ? POSES.slump : POSES.stand);
  const blend = easeInOut(clamp01(p / 0.34));
  const barberPose = blendPose(poseFor(prev.beat === "reveal" ? "idle" : prev.beat), poseFor(card.beat), idx === 0 ? 1 : blend);

  const set = drawSet(card.beat, card.bench || 0, now);
  const breath = Math.sin(now * 2.1);

  // client in the chair, unless everyone has gone
  if (card.beat !== "alone") {
    figure(set.chairX - U * 0.005, set.floorY, U * 0.165, POSES.sit, Math.sin(now * 1.7),
      { color: "#5c6a7d", weight: 0.026, seatedAt: set.floorY - U * 0.155 });
  }

  const barberX = W * 0.20;
  const anchors = figure(barberX, set.floorY, U * 0.235, barberPose, breath, {});

  let phoneAnchor = null;
  if (card.beat === "phoneBuzz" || card.speaker === "phone") {
    const px = W * 0.76, py = H * 0.40;
    phone(px, py, U * 0.085, now);
    phoneAnchor = [px, py - U * 0.085];
  }

  if (card.speaker === "phone" && phoneAnchor) bubble(card.lines.join(" "), phoneAnchor, p / 0.28);
  else if (card.speaker === "barber") bubble(card.lines.join(" "), anchors.head, p / 0.28);
  else narration(card.lines, p / 0.5, false);

  furniture();
};

window.__total = () => (FILM ? FILM_TOTAL : TOTAL);
</script>
