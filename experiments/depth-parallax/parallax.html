<!doctype html>
<meta charset="utf-8">
<title>depth parallax</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
/*
 * 2.5D parallax: re-project an existing photo through its depth map.
 *
 * NOTHING IS INVENTED. Every output pixel is a sample of a pixel that was
 * already in the photograph, displaced by how far the depth model says it sits
 * from the camera. That is the whole reason for this approach over a generative
 * video model, which would cheerfully redraw a shop's sign as gibberish.
 *
 * THE TIMELINE IS A PURE FUNCTION OF t, matching render_short_video.js. The
 * page never animates itself - no rAF, no CSS transitions - because a renderer
 * stepping its own clock while the page steps another produces frames that land
 * wherever the two happen to meet, and the result is non-deterministic in a way
 * that is only subtly wrong.
 *
 * OCCLUSION IS THE HONEST LIMIT. Shifting a foreground reveals background that
 * was never photographed. Small camera moves plus a slight push-in keep the
 * holes off-frame; push the strength up and you will see stretching at the
 * subject's edge. That trade is the parameter worth tuning by eye.
 */
const VERT = `
attribute vec2 p; varying vec2 v;
void main(){ v = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }`;

const FRAG = `
precision highp float;
varying vec2 v;
uniform sampler2D img, dep;
uniform vec2 cam;        // camera offset this frame
uniform float strength;  // how far the nearest plane travels
uniform float zoom;      // push-in, also hides edge holes
uniform vec2 fit;        // aspect correction: source -> 9:16 frame

void main(){
  // Cover-fit the source into the frame, then apply the push-in.
  vec2 uv = (v - 0.5) / (fit * zoom) + 0.5;

  // Two-pass sample: read depth at the undisplaced point, displace, read again.
  // A single pass swims because it samples depth at the wrong place once the
  // offset is large.
  float d0 = texture2D(dep, uv).r;
  vec2 off = cam * (d0 - 0.5) * strength;
  float d1 = texture2D(dep, uv + off).r;
  vec2 uv2 = uv + cam * (mix(d0, d1, 0.5) - 0.5) * strength;

  if (uv2.x < 0.0 || uv2.x > 1.0 || uv2.y < 0.0 || uv2.y > 1.0) {
    gl_FragColor = vec4(0.0,0.0,0.0,1.0);
  } else {
    gl_FragColor = texture2D(img, uv2);
  }
}`;

const q = new URLSearchParams(location.search);
const W = +(q.get("w")||1080), H = +(q.get("h")||1920);
const STRENGTH = +(q.get("strength")||0.055);
const MOVE = q.get("move") || "orbit";

const c = document.getElementById("c");
c.width = W; c.height = H;
const gl = c.getContext("webgl", { preserveDrawingBuffer: true });
// Fail loudly. A null context here throws deep in shader setup and the page
// never defines __load, so the caller sees a missing function and goes looking
// in the renderer instead of at the browser flags.
if (!gl) throw new Error("no WebGL context - headless Chrome needs --enable-unsafe-swiftshader");

function shader(type, src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog); gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog,"p");
gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

function texture(image, unit){
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0+unit);
  // WebGL maps the image's FIRST row to t=0, while the quad's v.y=0 is the
  // bottom of the viewport - so without this every frame comes out vertically
  // mirrored. It reads as a 90-degree rotation on a portrait subject, which
  // sends you looking for an EXIF bug that is not there.
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,image);
  return t;
}

let ready = false, fit = [1,1];
window.__load = (imgSrc, depSrc) => new Promise((res)=>{
  const a = new Image(), b = new Image();
  let n = 0;
  const done = () => {
    if (++n < 2) return;
    texture(a,0); texture(b,1);
    gl.uniform1i(gl.getUniformLocation(prog,"img"),0);
    gl.uniform1i(gl.getUniformLocation(prog,"dep"),1);
    /*
     * COVER, NOT CONTAIN. We sample a sub-rectangle of the source that already
     * has the frame's aspect, so the photo fills 1080x1920 and the overflow is
     * cropped. The inverse of these ratios letterboxes instead - black bars
     * down both sides, which is the tell that the division went the wrong way.
     */
    const sa = a.width/a.height, fa = W/H;
    fit = sa > fa ? [sa/fa, 1] : [1, fa/sa];
    ready = true; res({w:a.width,h:a.height});
  };
  a.onload = done; b.onload = done;
  a.src = imgSrc; b.src = depSrc;
});

/** Camera path. Pure function of t, 0..1. */
function camera(t){
  const ease = 0.5 - 0.5*Math.cos(Math.PI*2*t);        // in and back, no jump at the loop
  if (MOVE === "push")  return { cam:[0,0], zoom: 1.0 + 0.10*t };
  if (MOVE === "drift") return { cam:[(t-0.5)*2, 0], zoom: 1.06 };
  // orbit: an ellipse, wider than tall, which reads as a head turn rather than a wobble
  const a = Math.PI*2*t;
  return { cam:[Math.sin(a), Math.cos(a)*0.45], zoom: 1.05 + 0.03*ease };
}

window.__setT = (t) => {
  if (!ready) return;
  const { cam, zoom } = camera(t);
  gl.uniform2f(gl.getUniformLocation(prog,"cam"), cam[0], cam[1]);
  gl.uniform1f(gl.getUniformLocation(prog,"strength"), STRENGTH);
  gl.uniform1f(gl.getUniformLocation(prog,"zoom"), zoom);
  gl.uniform2f(gl.getUniformLocation(prog,"fit"), fit[0], fit[1]);
  gl.viewport(0,0,W,H);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
};
</script>
